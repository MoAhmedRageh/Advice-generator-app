<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Advice generator app</title>
        <link rel="stylesheet" href="style.css">
        <link rel="shortcut icon" href="images/favicon-32x32.png" type="image/x-icon">
    </head>
    <body>
        <div class="card">
            <h1 class="card__title">Advice #<span id="title-id">117</span></h1>
            <p class="card__advice" id="advice">"It is easy to sit up an take notice, what's difficult is getting up and taking action"</p>
            <img src="images/pattern-divider-desktop.svg" alt="Pattern Divider" class="card__img">
            <div class="card__btn" id="btn"><img src="./images/icon-dice.svg" alt="Icon Dice" class="card__dice"></div>
        </div>

        <script src="main.js"></script>
    </body>
</html>
